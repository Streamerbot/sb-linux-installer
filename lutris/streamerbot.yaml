name: Streamer.bot
description: Supercharge your live stream with Streamer.bot
game_slug: streamerbot
version: Streamer.bot (Latest)
slug: streamerbot-latest
runner: wine

script:
  game:
    exe: $GAMEDIR/Streamer.bot.exe
    prefix: $GAMEDIR/prefix
    working_dir: $GAMEDIR

  files:
    - streamerbot:
        url: https://streamer.bot/api/releases/streamer.bot/latest/download
        filename: streamerbot.zip
    - WebView2:
        url: https://github.com/aedancullen/webview2-evergreen-standalone-installer-archive/releases/download/109.0.1518.78/MicrosoftEdgeWebView2RuntimeInstallerX64.exe
        filename: MicrosoftEdgeWebView2RuntimeInstallerX64.exe

  installer:
    - extract:
        file: streamerbot
        dst: $GAMEDIR/
    - task:
        name: create_prefix
        description: Creating Wine prefix
        arch: win64
        prefix: $GAMEDIR/prefix
        install_mono: false
        install_gecko: true
    - task:
        name: winetricks
        description: Installing .NET 4.8 will take a while...
        app: dotnet48
        prefix: $GAMEDIR/prefix
    - task:
        name: winetricks
        description: Installing d3dcompiler_47...
        app: d3dcompiler_47
        prefix: $GAMEDIR/prefix
    - task:
        name: winetricks
        description: Installing corefonts...
        app: corefonts
        prefix: $GAMEDIR/prefix
    - task:
        name: wineexec
        description: Installing WebView2...
        executable: WebView2
        prefix: $GAMEDIR/prefix
